<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>State AI Policy Tracker: trends since 2022</title>
<meta name="description" content="How AI policy activity by Indian state governments grew from 2022 to 2026, by state, kind of step, stage and sector.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..800&family=Source+Serif+4:opsz,wght@8..60,400&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: light; --bg: #faf9f5; --ink: #141413; --ink2: #5e5d59; --grid: #d9d7cf; --axis: #141413; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px 60px; }
  header { padding: 40px 0 8px; }
  header a { color: var(--ink2); font-size: 15px; }
  h1 { font: 800 clamp(30px, 5vw, 52px)/1.02 Archivo, system-ui, sans-serif; font-stretch: 112%; letter-spacing: -0.02em; margin: 14px 0 12px; max-width: 18ch; }
  .lede { max-width: 66ch; font-size: 18px; color: var(--ink2); margin: 0 0 8px; }
  .caveat { max-width: 78ch; font-size: 14.5px; color: var(--ink2); border-left: 3px solid var(--grid); padding: 4px 0 4px 14px; margin: 18px 0 0; }
  figure { margin: 54px 0 0; }
  figure h2 { font: 650 clamp(22px, 3.4vw, 34px)/1.15 Archivo, system-ui, sans-serif; font-stretch: 104%; text-align: center; margin: 0; letter-spacing: -0.01em; }
  figure .sub { font: 400 18px/1.3 "Source Serif 4", Georgia, serif; color: var(--ink2); text-align: center; margin: 4px 0 14px; }
  .legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 20px; font-size: 14.5px; font-weight: 650; margin-bottom: 6px; }
  .legend span { display: inline-flex; align-items: center; gap: 7px; }
  .legend i { width: 13px; height: 13px; border-radius: 50%; border: 1.3px solid var(--ink); display: inline-block; }
  svg { width: 100%; height: auto; display: block; overflow: visible; }
  svg text { font: 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); }
  svg .pt-label { fill: var(--ink); font-size: 13.5px; }
  figcaption { font-size: 14px; color: var(--ink2); max-width: 78ch; margin: 10px auto 0; text-align: center; }
  .multiples { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 18px 22px; margin-top: 10px; }
  .multiples h3 { font-size: 15px; margin: 0 0 2px; display: flex; justify-content: space-between; }
  .multiples h3 span { font-weight: 400; color: var(--ink2); }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 14.5px; font-variant-numeric: tabular-nums; margin-top: 12px; min-width: 760px; }
  th, td { text-align: right; padding: 7px 10px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { font-weight: 650; color: var(--ink2); border-bottom: 1.5px solid var(--axis); }
  .tip { position: fixed; z-index: 9; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 13px; padding: 6px 9px; border-radius: 5px; max-width: 260px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a href="./">State AI Policy Tracker</a>
    <h1>How state AI policy grew, 2022 to 2026</h1>
    <p class="lede" id="lede">Loading records.</p>
  </header>
  <main id="charts"><p><a href="research.html">Research findings and methodology</a> | <a href="https://huggingface.co/datasets/VKO34/INDIAN-STATE-WISE-AI-POLICY">Dataset on Hugging Face</a></p>
</main>
</div>
<div id="tip" class="tip" hidden></div>
<script src="trends.js?v=3"></script>
</body>
</html>
